<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On-Chain Renderer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            font-family: monospace;
            overflow: hidden;
        }
        
        .center {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error { color: #ff6b6b; max-width: 80%; padding: 2rem; }
        
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="status" class="center">
        <div class="spinner"></div>
    </div>
    
    <iframe id="frame"></iframe>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    <script>
        const CONTRACT = '0x953D288708bB771F969FCfD9BA0819eF506Ac718';
        // getTokenHtml returns the assembled document as a plain string.
        // The previous getTokenHtmlBase64EncodedDataUri + atob() path
        // corrupted any non-ASCII bytes (atob decodes to Latin-1, not
        // UTF-8). ethers' ABI string decoding handles UTF-8 correctly,
        // and this matches Art Blocks' reference viewer call-for-call.
        const ABI = [{
            "inputs": [
                {"internalType": "address", "name": "coreContract", "type": "address"},
                {"internalType": "uint256", "name": "tokenId", "type": "uint256"}
            ],
            "name": "getTokenHtml",
            "outputs": [{"internalType": "string", "name": "", "type": "string"}],
            "stateMutability": "view",
            "type": "function"
        }];
        
        function showError(msg) {
            const status = document.getElementById('status');
            const formattedMsg = msg.replace(/\n/g, '<br>');
            status.innerHTML = `<div class="error">${formattedMsg}</div>`;
        }

        // Some newer dependencies (e.g. ESM Three.js builds) ship as ES
        // modules but the generator-assembled HTML doesn't always mark
        // their <script> tags as type="module". A classic-script parser
        // throws on 'export'/static 'import' the instant it hits them, so
        // nothing after that tag runs. Detect that signature and patch it
        // before injection rather than touching the on-chain data itself.
        //
        // IMPORTANT: only classic-JS scripts are eligible. Pages also carry
        // non-JS script blocks - <script type="importmap">, GLSL shaders
        // (type="x-shader/..."), JSON data blocks, HTML templates. Setting
        // type="module" on those makes the browser execute non-JS as JS,
        // which is itself a source of "Unexpected token '<'" errors.
        function isClassicJs(el) {
            const t = (el.getAttribute('type') || '').trim().toLowerCase();
            return t === '' || t === 'text/javascript' || t === 'application/javascript';
        }

        function fixModuleScripts(html) {
            let doc;
            try {
                doc = new DOMParser().parseFromString(html, 'text/html');
            } catch (e) {
                return html; // malformed doc - leave as-is, let it fail loudly
            }

            const scripts = Array.from(doc.querySelectorAll('script'));
            const looksLikeModule = (el) => {
                const src = el.getAttribute('src') || '';
                const body = el.textContent || '';
                return /\.module\.[^/?#]*\.js(\?|#|$)/i.test(src) ||
                       /^\s*export\s/.test(body) ||
                       /\bimport\s*\*\s*as\s+\w+\s+from\s+['"]/.test(body) ||
                       /\bimport\s*\{[^}]*\}\s*from\s+['"]/.test(body) ||
                       /^\s*import\s+['"]/.test(body);
            };

            const classicScripts = scripts.filter(isClassicJs);
            const needsModule = classicScripts.some(looksLikeModule);
            if (!needsModule) return html;

            // Module scripts execute deferred, in their own scope. Mixing
            // module and classic scripts in one page changes execution
            // order guarantees, so convert all classic-JS tags together -
            // but leave typed non-JS blocks (importmap, shaders, JSON,
            // templates) strictly alone.
            classicScripts.forEach((s) => s.setAttribute('type', 'module'));
            console.info('[gaf-renderer] ES module signature detected; ' +
                classicScripts.length + ' classic script tag(s) converted to type="module"');
            return '<!DOCTYPE html>\n' + doc.documentElement.outerHTML;
        }
        
        async function load() {
            try {
                const parts = location.hash.slice(1).split('/').filter(p => p);
                if (parts.length < 2) throw new Error('Invalid URL format');
                
                const [contract, tokenId] = parts.slice(-2);
                if (!contract.startsWith('0x') || contract.length !== 42) throw new Error('Invalid contract address');
                if (isNaN(tokenId)) throw new Error('Invalid token ID');
                
                const provider = new ethers.JsonRpcProvider('https://mainnet.infura.io/v3/e29898f2b78f4810ae2d0ce4c2a4a449');
                const instance = new ethers.Contract(CONTRACT, ABI, provider);
                
                let result;
                try {
                    result = await instance.getTokenHtml(contract, tokenId);
                } catch (contractError) {
                    throw new Error('Token not supported');
                }

                if (!result || typeof result !== 'string' || result.length < 20) {
                    throw new Error('Token not supported');
                }

                const frame = document.getElementById('frame');
                const html = fixModuleScripts(result);

                // srcdoc keeps the frame same-origin with the parent page.
                // frame.src = 'data:text/html;base64,...' gives the frame an
                // OPAQUE origin instead - fine for most projects, but breaks
                // anything that touches storage APIs, postMessage, or a
                // same-origin CORS check from inside the artwork. Art Blocks'
                // own reference viewer (github.com/ArtBlocks/on-chain-generator-viewer)
                // uses srcDoc for exactly this reason.
                frame.srcdoc = html;

                document.getElementById('status').style.display = 'none';
                frame.style.display = 'block';
                
            } catch (error) {
                let msg;
                
                if (error.message.includes('Invalid URL format') || error.message.includes('Invalid contract address') || error.message.includes('Invalid token ID')) {
                    msg = 'Failed to load artwork\n\nInvalid URL format, please use proper format: /#/[contract-address]/[token-id]';
                } else if (error.message.includes('Token not supported')) {
                    msg = 'Failed to load artwork\n\nToken not returned, please check contract address and token ID';
                } else {
                    msg = 'Failed to load artwork\n\nNetwork or contract call error, please try again';
                }
                
                showError(msg);
            }
        }
        
        window.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
