<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>On-Chain Renderer</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background: #000;
            font-family: monospace;
            overflow: hidden;
        }
        
        .center {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            text-align: center;
        }
        
        .spinner {
            width: 40px;
            height: 40px;
            border: 3px solid #333;
            border-top: 3px solid #fff;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .error { color: #ff6b6b; max-width: 80%; padding: 2rem; }
        
        iframe {
            width: 100vw;
            height: 100vh;
            border: none;
            display: none;
        }
    </style>
</head>
<body>
    <div id="status" class="center">
        <div class="spinner"></div>
    </div>
    
    <iframe id="frame"></iframe>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.1/ethers.umd.min.js"></script>
    <script>
        const CONTRACT = '0x953D288708bB771F969FCfD9BA0819eF506Ac718';
        // getTokenHtml returns the assembled document as a plain string.
        // The previous getTokenHtmlBase64EncodedDataUri + atob() path
        // corrupted any non-ASCII bytes (atob decodes to Latin-1, not
        // UTF-8). ethers' ABI string decoding handles UTF-8 correctly,
        // and this matches Art Blocks' reference viewer call-for-call.
        const ABI = [{
            "inputs": [
                {"internalType": "address", "name": "coreContract", "type": "address"},
                {"internalType": "uint256", "name": "tokenId", "type": "uint256"}
            ],
            "name": "getTokenHtml",
            "outputs": [{"internalType": "string", "name": "", "type": "string"}],
            "stateMutability": "view",
            "type": "function"
        }];
        
        function showError(msg) {
            const status = document.getElementById('status');
            const formattedMsg = msg.replace(/\n/g, '<br>');
            status.innerHTML = `<div class="error">${formattedMsg}</div>`;
        }

        // ---------------------------------------------------------------
        // IPFS gateway-fallback shim (A/B TEST BUILD)
        //
        // The on-chain generator assembles a wrapper (document scaffold +
        // gunzip bootstrap + dependency + tokenData + artist script). That
        // wrapper emits tokenData.preferredIPFSGateway but includes NO logic
        // to use it. This shim completes the wrapper: if an IPFS asset load
        // fails, retry the same CID against the chain-provided preferred
        // gateway. The artist script stays byte-for-byte intact inside the
        // wrapper; only the envelope gains fallback glue.
        //
        // Two placements are provided so the timing can be A/B tested in a
        // real browser (?shim=A or ?shim=B). Once one is confirmed, the
        // other and this switch get removed.
        // ---------------------------------------------------------------

        // The shim's core logic, shared by both placements. Written WITHOUT
        // regex literals on purpose: this string is nested inside a template
        // literal here, then injected as text into the frame, then parsed by
        // the browser. Regex backslashes do not survive those layers cleanly
        // (an earlier version double-escaped /\/ipfs\// and broke the frame).
        // indexOf/slice string parsing has no escaping hazard, so it is used
        // instead. The closing script tag is split as '<' + '/script>' so it
        // cannot terminate THIS document's script block early.
        const SHIM_CORE = [
            "var preferred = null;",
            "try { if (tokenData && typeof tokenData.preferredIPFSGateway === 'string' && tokenData.preferredIPFSGateway) { preferred = tokenData.preferredIPFSGateway; while (preferred.charAt(preferred.length-1) === '/') preferred = preferred.slice(0, -1); } } catch(e){}",
            "if (!preferred) return;",
            // Extract '<CID>/<path>' after the '/ipfs/' segment using indexOf.
            "function tail(u){ if (typeof u !== 'string') return null; var k = u.indexOf('/ipfs/'); return k === -1 ? null : u.slice(k + 6); }",
            "function makeWrapper(_li){",
            "  var w = function(path, ok, fail){",
            "    var t = tail(path);",
            "    if (!t) return _li.apply(this, arguments);",
            "    var alt = preferred + '/' + t, self = this;",
            "    return _li.call(self, path, ok, function(){ try{console.info('[gaf] IPFS fallback ->', alt);}catch(e){} _li.call(self, alt, ok, fail); });",
            "  };",
            "  for (var k in _li){ try{ w[k] = _li[k]; }catch(e){} }",
            "  return w;",
            "}"
        ].join("\n");

        const CLOSE_SCRIPT = "<" + "/script>";

        // Placement B: synchronous wrap, injected AFTER the gunzip bootstrap
        // and BEFORE the artist script. loadImage already exists, wrap directly.
        const SHIM_B = "<script>(function(){\n"
            + "if (typeof window.loadImage !== 'function') return;\n"
            + SHIM_CORE + "\n"
            + "window.loadImage = makeWrapper(window.loadImage);\n"
            + "})();" + CLOSE_SCRIPT;

        // Placement A: property-trap wrap, injected at document top BEFORE p5
        // is inflated. Wrap loadImage the instant p5 assigns it.
        const SHIM_A = "<script>(function(){\n"
            + SHIM_CORE + "\n"
            + "var _real;\n"
            + "Object.defineProperty(window, 'loadImage', { configurable:true, get:function(){return _real;}, set:function(fn){ _real = (typeof fn==='function') ? makeWrapper(fn) : fn; } });\n"
            + "})();" + CLOSE_SCRIPT;

        // Insert the shim into the wrapper HTML string. Uses targeted string
        // matching (NOT DOMParser) to avoid corrupting nested-script payloads
        // like Quine. Returns the HTML unchanged if the anchor isn't found,
        // so a failed match degrades to current behavior rather than breaking.
        function injectShim(html, mode) {
            if (mode !== 'A' && mode !== 'B') return html; // shim disabled -> exact on-chain bytes

            if (mode === 'A') {
                // Inject immediately after the first tokenData-defining script
                // closes, near the top, before the dependency scripts.
                // NOTE: the closing tag is built by concatenation so this
                // literal cannot terminate THIS page's own <script> block.
                const anchor = '<' + '/script>';
                const idx = html.indexOf(anchor);
                if (idx === -1) return html;
                const at = idx + anchor.length;
                return html.slice(0, at) + SHIM_A + html.slice(at);
            }

            // mode === 'B': inject right before the LAST <script> tag, which is
            // the artist script (dependencies and bootstrap come before it).
            const lastScript = html.lastIndexOf('<script>');
            if (lastScript === -1) return html;
            return html.slice(0, lastScript) + SHIM_B + html.slice(lastScript);
        }

        function getShimMode() {
            // ?shim=A or ?shim=B on the PARENT page URL. Default: off (no shim).
            const m = new URLSearchParams(location.search).get('shim');
            return (m === 'A' || m === 'B') ? m : 'off';
        }
        
        async function load() {
            try {
                const parts = location.hash.slice(1).split('/').filter(p => p);
                if (parts.length < 2) throw new Error('Invalid URL format');
                
                const [contract, tokenId] = parts.slice(-2);
                if (!contract.startsWith('0x') || contract.length !== 42) throw new Error('Invalid contract address');
                if (isNaN(tokenId)) throw new Error('Invalid token ID');
                
                const provider = new ethers.JsonRpcProvider('https://mainnet.infura.io/v3/e29898f2b78f4810ae2d0ce4c2a4a449');
                const instance = new ethers.Contract(CONTRACT, ABI, provider);
                
                let result;
                try {
                    result = await instance.getTokenHtml(contract, tokenId);
                } catch (contractError) {
                    throw new Error('Token not supported');
                }

                if (!result || typeof result !== 'string' || result.length < 20) {
                    throw new Error('Token not supported');
                }

                const frame = document.getElementById('frame');

                // Complete the wrapper: inject the gateway-fallback shim per the
                // A/B mode (?shim=A|B). When mode is 'off' this returns the exact
                // on-chain bytes unchanged. Injection is targeted string insertion,
                // never DOMParser, so nested-script payloads (Quine) are safe.
                const shimMode = getShimMode();
                const html = injectShim(result, shimMode);
                if (shimMode !== 'off') {
                    try { console.info('[gaf] shim mode:', shimMode, '| html delta:', html.length - result.length, 'bytes'); } catch (e) {}
                }

                frame.srcdoc = html;

                document.getElementById('status').style.display = 'none';
                frame.style.display = 'block';
                
            } catch (error) {
                let msg;
                
                if (error.message.includes('Invalid URL format') || error.message.includes('Invalid contract address') || error.message.includes('Invalid token ID')) {
                    msg = 'Failed to load artwork\n\nInvalid URL format, please use proper format: /#/[contract-address]/[token-id]';
                } else if (error.message.includes('Token not supported')) {
                    msg = 'Failed to load artwork\n\nToken not returned, please check contract address and token ID';
                } else {
                    msg = 'Failed to load artwork\n\nNetwork or contract call error, please try again';
                }
                
                showError(msg);
            }
        }
        
        window.addEventListener('DOMContentLoaded', load);
    </script>
</body>
</html>
